[package]
name = "ckb-contract-test-fram"
version = "0.1.0"
edition = "2021"


[dependencies]
ckb-testtool = { git = "https://github.com/gpBlockchain/ckb-testtool.git", branch = "copilot/fix-aarch64-pc" }
serde_json = "1.0"
bytes = "1.5.0"
serde = { version = "1.0.209", features = ["derive"] }
secp256k1 = { version = "0.28", features = ["rand-std"] }
musig2 = "0.0.11"
sha2 = "0.10"
hex = "0.4.3"
syn = "2.0.98"

[dev-dependencies]
ckb-std = "0.17.0"
bitcoin = { version = "0.31", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
walkdir = "2.4"
tikv-jemallocator = "0.6"


[dev-dependencies.serde_molecule]
version = "1.0.0"
git = "https://github.com/XuJiandong/serde_molecule.git"
rev = "07f145d"

[patch.crates-io]
ckb-chain-spec = { git = "https://github.com/gpBlockchain/ckb.git", branch = "copilot/fix-aarch64-pc-again" }
ckb-constant = { git = "https://github.com/gpBlockchain/ckb.git", branch = "copilot/fix-aarch64-pc-again" }
ckb-crypto = { git = "https://github.com/gpBlockchain/ckb.git", branch = "copilot/fix-aarch64-pc-again" }
ckb-dao = { git = "https://github.com/gpBlockchain/ckb.git", branch = "copilot/fix-aarch64-pc-again" }
ckb-dao-utils = { git = "https://github.com/gpBlockchain/ckb.git", branch = "copilot/fix-aarch64-pc-again" }
ckb-error = { git = "https://github.com/gpBlockchain/ckb.git", branch = "copilot/fix-aarch64-pc-again" }
ckb-fixed-hash = { git = "https://github.com/gpBlockchain/ckb.git", branch = "copilot/fix-aarch64-pc-again" }
ckb-hash = { git = "https://github.com/gpBlockchain/ckb.git", branch = "copilot/fix-aarch64-pc-again" }
ckb-jsonrpc-types = { git = "https://github.com/gpBlockchain/ckb.git", branch = "copilot/fix-aarch64-pc-again" }
ckb-logger = { git = "https://github.com/gpBlockchain/ckb.git", branch = "copilot/fix-aarch64-pc-again" }
ckb-occupied-capacity = { git = "https://github.com/gpBlockchain/ckb.git", branch = "copilot/fix-aarch64-pc-again" }
ckb-pow = { git = "https://github.com/gpBlockchain/ckb.git", branch = "copilot/fix-aarch64-pc-again" }
ckb-rational = { git = "https://github.com/gpBlockchain/ckb.git", branch = "copilot/fix-aarch64-pc-again" }
ckb-resource = { git = "https://github.com/gpBlockchain/ckb.git", branch = "copilot/fix-aarch64-pc-again" }
ckb-script = { git = "https://github.com/gpBlockchain/ckb.git", branch = "copilot/fix-aarch64-pc-again" }
ckb-systemtime = { git = "https://github.com/gpBlockchain/ckb.git", branch = "copilot/fix-aarch64-pc-again" }
ckb-traits = { git = "https://github.com/gpBlockchain/ckb.git", branch = "copilot/fix-aarch64-pc-again" }
ckb-types = { git = "https://github.com/gpBlockchain/ckb.git", branch = "copilot/fix-aarch64-pc-again" }
ckb-verification = { git = "https://github.com/gpBlockchain/ckb.git", branch = "copilot/fix-aarch64-pc-again" }
ckb-verification-traits = { git = "https://github.com/gpBlockchain/ckb.git", branch = "copilot/fix-aarch64-pc-again" }
ckb-vm = { git = "https://github.com/mohanson-fork/ckb-vm.git", branch = "fix_aarch64_pc" }
ckb-vm-definitions = { git = "https://github.com/mohanson-fork/ckb-vm.git", branch = "fix_aarch64_pc" }
